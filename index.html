<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0b2e" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/brand/mark-white.webp" type="image/webp" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>2kTunes · Distribute worldwide. Grow your audience. Get paid locally.</title>
    <meta
      name="description"
      content="2kTunes is an African-first music distribution platform: release to global stores, grow with creator campaigns, and withdraw royalties to mobile money or your bank."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="2kTunes" />
    <meta property="og:title" content="2kTunes · Distribute worldwide. Get paid locally." />
    <meta
      property="og:description"
      content="Release to global stores, grow with creator campaigns, and withdraw royalties to mobile money or your bank."
    />
    <meta property="og:locale" content="en_TZ" />
    <meta property="og:locale:alternate" content="sw_TZ" />
    <!-- No og:image yet: add a 1200x630 share image to public/ and reference it
         with an absolute URL (og:image + twitter:image) before launch. Until
         then the card is a text-only "summary". -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="2kTunes · Distribute worldwide. Get paid locally." />
    <meta
      name="twitter:description"
      content="Release to global stores, grow with creator campaigns, and withdraw royalties to mobile money or your bank."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
